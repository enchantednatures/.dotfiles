k9s:
  ui:
    skin: gruvbox-dark # => All clusters will use this skin unless otherwise specified in the context configuration file
    enableMouse: false
    headless: false
    logoless: false
    crumbsless: false
    noIcons: false
  refreshRate: 2
  maxConnRetry: 5
  readOnly: false
  noExitOnCtrlC: false
  skipLatestRevCheck: false
  logger:
    tail: 100
    buffer: 5000
    sinceSeconds: 300
    textWrap: false
    showTime: false
  thresholds:
    cpu:
      critical: 90
      warn: 70
    memory:
      critical: 90
      warn: 70
  liveViewAutoRefresh: false
  screenDumpDir: /tmp/k9s/screen-dumps
  disablePodCounting: false
  shellPod:
    image: busybox:1.35.0
    namespace: default
    limits:
      cpu: 100m
      memory: 100Mi
  imageScans:
    enable: false
    exclusions:
      namespaces: []
      labels: {}
